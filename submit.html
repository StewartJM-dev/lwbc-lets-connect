<body>

<div class="back-bar">
  <div class="wrap"><a href="index.html" class="back-link">&larr; Back to Home</a></div>
</div>

<header class="banner-image">
  <img src="images/banner.jpg" alt="LWBC Let's Connect Podcast with Pastor Raymond Purdy — a ministry of Living Word Baptist Church. Faith. Truth. Real talk. Real life.">
</header>

<div class="page-intro">
  <div class="wrap">
    <p class="eyebrow">Get in touch</p>
    <h1>Contact Living Word</h1>
    <p class="lede">Have a question, a prayer request, or just want to reach out? Send a message to Living Word Baptist Church.</p>
  </div>
</div>

<section style="padding-top:36px;">
  <div class="wrap">

    <!--
      FORM NOTE FOR JOHN:
      GitHub Pages is static and can't process form submissions server-side,
      so this form currently opens the visitor's email client via a mailto:
      link, addressed to the address set in SHOW_EMAIL at the bottom of this file
      (currently lwbcsv@gmail.com). Caveat: it requires the visitor to have an
      email client configured.

      UPGRADE PATH (optional, when ready): swap this for a free Formspree
      form (formspree.io) — sign up, get an endpoint, change the <form>
      action to "https://formspree.io/f/YOUR_ID" and method to "POST",
      remove the JS mailto handler below. That submits silently in-page
      without opening the visitor's mail app.
    -->

    <form class="question-form" id="question-form">
      <div class="field">
        <label for="q-name">Name</label>
        <input type="text" id="q-name" name="name" required>
      </div>
      <div class="field">
        <label for="q-email">Email (optional, if you'd like a reply)</label>
        <input type="email" id="q-email" name="email">
      </div>
      <div class="field">
        <label for="q-question">Your message</label>
        <textarea id="q-question" name="question" required></textarea>
      </div>
      <button type="submit" class="btn btn-solid">Send message</button>
      <p class="form-note">This opens your email app, addressed to the church, with your message filled in.</p>
    </form>

  </div>
</section>

<footer class="site-footer-image">
  <img src="images/footer.jpg" alt="LWBC Let's Connect Podcast, Living Word Baptist Church, Sweet Valley PA. Service times: Sunday School 9:00 AM, Morning Service 10:00 AM, Evening Service 6:00 PM, Wednesday Night Heartbeat Service 7:00 PM. Address: 40 Hess Lane, Sweet Valley PA.">
  <a class="footer-hotspot fh-logo" href="index.html" aria-label="Home"></a>
  <a class="footer-hotspot fh-facebook" href="https://www.facebook.com/profile.php?id=100064349513334" target="_blank" rel="noopener" aria-label="LWBC on Facebook"></a>
  <a class="footer-hotspot fh-youtube" href="https://www.youtube.com/@LivingWordBaptistChurchS-ff5dt/featured" target="_blank" rel="noopener" aria-label="LWBC on YouTube"></a>
  <a class="footer-hotspot fh-email" href="mailto:lwbcsv@gmail.com" aria-label="Email LWBC"></a>
</footer>

<script>
  var SHOW_EMAIL = 'lwbcsv@gmail.com';

  document.getElementById('question-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('q-name').value.trim();
    var email = document.getElementById('q-email').value.trim();
    var question = document.getElementById('q-question').value.trim();

    var subject = 'Message from the Living Word website';
    var bodyLines = [
      'From: ' + name + (email ? ' (' + email + ')' : ''),
      '',
      question
    ];
    var mailto = 'mailto:' + SHOW_EMAIL
      + '?subject=' + encodeURIComponent(subject)
      + '&body=' + encodeURIComponent(bodyLines.join('\n'));

    window.location.href = mailto;
  });
</script>
</body>
</html>
